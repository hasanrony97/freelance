  :root {
    --ink: #0e1f1e;
    --teal: #0d4d4a;
    --teal-deep: #083634;
    --mint: #d7ebe4;
    --marigold: #ffc02e;
    --white: #ffffff;

    --surface: #ffffff;
    --text: var(--ink);
    --muted: #4d625f;
    --rule: #cfdcd7;
    --accent: var(--teal);
    --soft: var(--mint);

    --wrap: 1140px;
    --gutter: clamp(20px, 5vw, 56px);

    --body: "Hind Siliguri", "Nirmala UI", "Segoe UI", system-ui, sans-serif;

  :root[data-theme="dark"] {
    --bg: #0b1716;
    --surface: #12231f;
    --text: #e7f0ed;
    --muted: #9fb5b0;
    --rule: #24403b;
    --accent: #6fd1bf;
    --soft: #173430;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--body); font-size: 1.1rem; line-height: 1.65;

  h1, h2, h3, p, ul, ol { margin: 0; }
  ul, ol { padding: 0; list-style: none; }
  a { color: inherit; }
  a:focus-visible, button:focus-visible {

  }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding-inline: var(--gutter); }

  h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.1; }

  section { padding-block: clamp(64px, 9vw, 112px); scroll-margin-top: 64px; }

  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn-main { background: var(--marigold); color: var(--ink); }
  .btn-ghost { border-color: currentColor; color: inherit; background: transparent; }

  /* ---------- top bar ---------- */

  .top .wrap {

  .brand span { color: var(--marigold); }
  .top nav { display: flex; gap: clamp(14px, 2.6vw, 28px); }

  .tools { display: flex; align-items: center; gap: 10px; }
  .theme {

  .theme svg { width: 19px; height: 19px; }
  .theme .sun { display: none; }

  :root[data-theme="dark"] .theme .moon { display: none; }
  .lang { display: inline-flex; background: rgba(255,255,255,.12); border-radius: 999px; padding: 4px; }

  .answer li::before {

  /* ---------- services ---------- */

  .case { display: block; text-decoration: none; }
  .screen {

  .screen::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 26px; z-index: 1;
    background: var(--soft);

  .screen iframe {

  .case h3 { margin-top: 16px; font-size: 1.45rem; }
  .case p { margin-top: 4px; color: var(--muted); }
  .case:hover h3 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .facts li { padding-block: 18px; border-top: 1px solid var(--rule); }
  .facts li:last-child { border-bottom: 1px solid var(--rule); }
  .facts b { display: block; font: 700 1.2rem/1.3 var(--display); }
  .facts span { color: var(--muted); }

  /* ---------- process ---------- */
  .steps {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px; margin-top: clamp(32px, 5vw, 52px); counter-reset: step;
  }
  .steps li { position: relative; padding-top: 64px; }
  .steps li::before {
    counter-increment: step; content: counter(step);
    position: absolute; top: 0; left: 0; width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center; font: 800 1.3rem/1 var(--display);
    background: var(--marigold); color: var(--ink);
  }
  .steps li::after {
    content: ""; position: absolute; top: 22px; left: 58px; right: -8px; height: 2px;
    background: repeating-linear-gradient(90deg, var(--rule) 0 8px, transparent 8px 14px);
  }
  .steps li:last-child::after { display: none; }
  .steps h3 { font-size: 1.3rem; }
  .steps p { margin-top: 6px; color: var(--muted); }

  /* ---------- contact ---------- */
  .contact { background: var(--teal-deep); color: var(--white); }
  .contact .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); align-items: center; }
  .contact p { margin-top: 14px; color: #cfe3dd; max-width: 42ch; }
  .channels { display: grid; gap: 12px; }
  .channel {
    display: flex; align-items: center; gap: 16px; text-decoration: none;
    padding: 16px 20px; border-radius: 18px; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    transition: background-color .15s ease, transform .15s ease;

  .channel:hover { background: rgba(255,255,255,.13); transform: translateX(4px); }
  .channel[hidden] { display: none; }
  .channel svg { width: 28px; height: 28px; flex: none; color: var(--marigold); }
  .channel b { display: block; font-weight: 600; }
  .channel span { font-size: .95rem; color: #b8d3cc; overflow-wrap: anywhere; }
  footer { background: var(--teal-deep); color: #a9c7c0; font-size: .98rem; }
  footer .wrap {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;
    padding-block: 22px; border-top: 1px solid rgba(255,255,255,.14);
  }
  footer a { color: var(--white); text-underline-offset: 4px; }

  /* ---------- small screens ---------- */
  @media (max-width: 900px) {
    .hero .wrap, .services .wrap, .proof .grid, .contact .wrap { grid-template-columns: minmax(0, 1fr); }
    .services .intro { position: static; }
    .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 36px; }
    .steps li::after { display: none; }
  }
  @media (max-width: 640px) {
    .top nav { display: none; }
    .steps { grid-template-columns: minmax(0, 1fr); }
    .service-list > li { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .answer { min-height: 0; }
  }
</style>

let current = "web";
const lang = () => document.documentElement.lang;
const t = key => TEXT[key][lang()];

function whatsappLink(service) {
  const text = t("pick.msg") + (service ? t(`s.${service}.t`) : "");
  return `https://wa.me/${CONTACT.whatsapp}?text=${encodeURIComponent(text)}`;
}

function renderPicker(animate) {
  document.getElementById("options").innerHTML = SERVICES.map(id =>
    `<button type="button" data-service="${id}" aria-pressed="${id === current}">${ICONS[id]}<span>${t(`s.${id}.t`)}</span></button>`
  ).join("");
  const answer = document.getElementById("answer");
  answer.innerHTML = `
    <h3>${t(`s.${current}.t`)}</h3>
    <p>${t(`s.${current}.d`)}</p>
    <div>
      <ul>${t(`s.${current}.list`).map(item => `<li>${item}</li>`).join("")}</ul>
      <div class="actions">
        <a class="btn btn-main" href="${whatsappLink(current)}" target="_blank" rel="noopener">${t("pick.ask")}</a>
        <a class="btn btn-ghost" href="#svc-${current}" data-jump="${current}">${t("pick.more")}</a>
      </div>
    </div>`;
  if (animate) {
    answer.classList.remove("swap");
    void answer.offsetWidth;   /* অ্যানিমেশন আবার চালাতে */
    answer.classList.add("swap");
  }
}

function renderServices() {
  document.getElementById("service-list").innerHTML = SERVICES.map(id => {
    const note = TEXT[`s.${id}.note`] ? `<p class="note">${t(`s.${id}.note`)}</p>` : "";
    return `<li id="svc-${id}">
      <div class="icon">${ICONS[id]}</div>
      <div>
        <h3>${t(`s.${id}.t`)}</h3>
        <p>${t(`s.${id}.d`)}</p>
        <ul class="tags">${t(`s.${id}.list`).map(item => `<li>${item}</li>`).join("")}</ul>
        ${note}
      </div>
    </li>`;
  }).join("");
}

function setLanguage(next) {
  document.documentElement.lang = next;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-label]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nLabel)); });
  document.querySelectorAll(".lang button").forEach(btn => {
    btn.setAttribute("aria-pressed", String(btn.dataset.lang === next));
  });
  document.getElementById("ch-whatsapp").href = whatsappLink("");
  renderPicker(false);
  renderServices();
  try { localStorage.setItem("lang", next); } catch (e) {}
}

/* সেবা বাছাই */
document.getElementById("options").addEventListener("click", event => {
  const btn = event.target.closest("button");
  if (!btn) return;
  current = btn.dataset.service;
  renderPicker(true);
  document.querySelector(`#options [data-service="${current}"]`).focus();
});

/* "বিস্তারিত দেখুন": সেবার অংশে গিয়ে সেটি একটু আলোকিত করে */
document.getElementById("answer").addEventListener("click", event => {
  const jump = event.target.closest("[data-jump]");
  if (!jump) return;
  const row = document.getElementById(`svc-${jump.dataset.jump}`);
  document.querySelectorAll(".service-list > li.flash").forEach(li => li.classList.remove("flash"));
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 2200);
});

/* কাজের নমুনা: আসল সাইটটি ছোট করে দেখানো */
const screen = document.getElementById("screen");
const fitPreview = () => {
  screen.querySelector("iframe").style.transform = `scale(${screen.clientWidth / 1280})`;
};
new ResizeObserver(fitPreview).observe(screen);

/* থিম */
document.getElementById("theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch (e) {}
});

document.querySelectorAll(".lang button").forEach(btn => {
  btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
});

for (const id of ["upwork", "fiverr"]) {
  if (CONTACT[id]) {
    const link = document.getElementById(`ch-${id}`);
    link.href = CONTACT[id];
    link.hidden = false;
  }
}

let saved = null;
try { saved = localStorage.getItem("lang"); } catch (e) {}
setLanguage(saved === "bn" ? "bn" : "en");
